<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src http://127.0.0.1:* ws://127.0.0.1:* http://localhost:* ws://localhost:*"
    />
    <title>Descant</title>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css" />
  </head>
  <body>
    <div id="shell">
      <div id="titlebar">
        <span class="brand">Descant</span>
        <button id="btn-run-file" title="Run the open file" disabled></button>
        <span id="titlebar-context"></span>
        <span class="spacer"></span>
        <span id="titlebar-source"></span>
      </div>

      <div id="body">
        <nav id="activity-bar"></nav>

        <aside id="sidebar">
          <div class="sidebar-header">
            <span id="sidebar-title">Explorer</span>
            <span class="spacer"></span>
            <button id="btn-new-session" title="Open a folder">Open</button>
            <button id="btn-refresh" title="Reload from disk">Reload</button>
          </div>
          <div class="sidebar-scroll" id="sidebar-scroll"></div>
        </aside>

        <main id="center">
          <div id="tabs"></div>
          <div id="editor-area">
            <div class="view active" id="view-welcome"></div>
            <div class="view" id="view-panel-generic"></div>
            <div class="view" id="view-editor"><div id="monaco-host"></div></div>
          </div>

          <div id="panel" class="hidden">
            <div class="panel-header">
              <span>Terminal</span>
              <span id="panel-cwd" class="spacer"></span>
              <button id="btn-panel-close">Close</button>
            </div>
            <div id="terminal-host"></div>
          </div>
        </main>

        <aside id="agent-panel">
          <div class="agent-header">
            <i class="dot idle" id="agent-dot"></i>
            <span class="title" id="agent-title">Agent</span>
            <span class="meta" id="agent-meta"></span>
            <button class="linkish" id="btn-back-to-chat" style="display: none">
              Back to chat
            </button>
            <select id="chat-mode" title="How tool permissions are handled">
              <option value="manual">Ask me</option>
              <option value="acceptEdits">Auto-accept edits</option>
              <option value="plan">Plan only</option>
            </select>
          </div>
          <div id="agent-log"></div>
          <div class="composer">
            <textarea
              id="composer-input"
              rows="2"
              placeholder="Message Claude Code…"
            ></textarea>
            <div class="composer-row">
              <select id="composer-target" title="Repo this conversation runs in"></select>
              <span class="hint" id="composer-hint"></span>
              <button class="btn secondary" id="btn-run-terminal" title="Open the terminal and run this as a shell command">
                Run
              </button>
              <button class="btn secondary" id="btn-stop" style="display: none">Stop</button>
              <button class="btn" id="btn-send">Send</button>
            </div>
          </div>
        </aside>
      </div>

      <div id="statusbar">
        <span class="item" id="status-backend">connecting…</span>
        <span class="item clickable" id="status-branch" title="Branch"></span>
        <span class="spacer"></span>
        <span class="item" id="status-lang"></span>
      </div>
    </div>

    <div id="toast"></div>

    <!-- Load order matters: the xterm UMD bundles must attach to window BEFORE
         Monaco's AMD loader defines `define.amd`, or they register as anonymous
         AMD modules and never reach the global scope. -->
    <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="../node_modules/monaco-editor/min/vs/loader.js"></script>

    <script src="icons.js"></script>
    <script src="fileicons.js"></script>
    <script src="contextmenu.js"></script>
    <script src="settings.js"></script>
    <script src="views.js"></script>
    <script src="term.js"></script>
    <script src="chat.js"></script>
    <script src="resize.js"></script>
    <script src="editor.js"></script>
    <script src="app.js"></script>
  </body>
</html>
